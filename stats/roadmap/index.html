<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BoxRun roadmap</title>
<meta name="theme-color" content="#1b1c2c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stats/pages.css">
<style>
  /* a colour per state, always shown next to the state's word */
  :root { --st-done: var(--ok-ink); --st-built: var(--blue-ink); --st-building: var(--gold-ink); --st-queued: #b9a6ff;
          --st-idea: var(--muted); --st-parked: #77749a; --st-other: var(--muted); }
  @media (prefers-color-scheme: light) { :root { --st-queued: #6346c8; --st-parked: #9d9ab8; } }
  .pill.queued { border-color: var(--st-queued); color: var(--st-queued); }
  .sw { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 3px; vertical-align: -0.05em; margin-right: 0.35rem; flex: none; }
  .sw.done, .seg-done { background: var(--st-done); }
  .sw.built, .seg-built { background: var(--st-built); }
  .sw.building, .seg-building { background: var(--st-building); }
  .sw.queued, .seg-queued { background: var(--st-queued); }
  .sw.idea, .seg-idea { background: repeating-linear-gradient(135deg, var(--st-idea) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--st-idea); }
  .sw.parked, .seg-parked { background: repeating-linear-gradient(45deg, var(--st-parked) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--st-parked); }
  .sw.other, .seg-other { background: var(--grid); box-shadow: inset 0 0 0 1px var(--st-other); }
  .ico { width: 1.1rem; height: 1.1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .w { display: inline-block; min-width: 1.35rem; padding: 0 0.3rem; border-radius: 4px; font: 700 0.75rem/1.5 var(--body); text-align: center; border: 1px solid var(--line); color: var(--muted); }
  .w.M { border-color: var(--gold-ink); color: var(--gold-ink); }
  a.chipid { font-weight: 700; text-decoration: none; white-space: nowrap; }
  a.chipid:hover { text-decoration: underline; }
  h2 .aside { font: 400 0.9rem var(--body); color: var(--muted); letter-spacing: 0; margin-left: 0.5rem; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
  @media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.85rem 1rem; min-width: 0; }
  .box > h3 { display: flex; align-items: center; gap: 0.5rem; font: 800 1.15rem/1.2 var(--display); letter-spacing: 0.02em; margin-bottom: 0.55rem; }
  .box > h3 .w { margin-left: auto; }
  .box.run > h3 { color: var(--gold-ink); }
  .box.run { border-top: 3px solid var(--st-building); }
  .box.wait { border-top: 3px solid var(--red-ink); }
  .box.wait > h3 .ico { color: var(--red-ink); }
  .whoset { display: inline-flex; gap: 0.2rem; flex: none; }
  .lead { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.9rem; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  /* A row flows as one paragraph: the tag sits inline before the text and the text wraps under it, so no tag, however
     long, can squeeze the text into a narrow column (Marcus's phone, 11-07: a flex row did, three times). */
  ul.list > li { display: block; padding: 0.4rem 0; border-top: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
  ul.list > li:first-child { border-top: 0; padding-top: 0; }
  ul.list > li > .txt { overflow-wrap: anywhere; }
  ul.list > li > .tag { margin-right: 0.45rem; }
  .tag { font: 700 0.8rem var(--body); color: var(--ink); background: var(--wash); border-radius: 4px; padding: 0 0.35rem; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .donetoday { display: flex; gap: 0.5rem; align-items: baseline; margin: 0.75rem 0 0; color: var(--muted); font-size: 0.9rem; }
  .donetoday .ico { color: var(--st-done); align-self: center; }
  .donetoday b { color: var(--ink); }
  details.fold { margin-top: 0.5rem; }
  details.fold > summary { color: var(--link); font-size: 0.9rem; display: inline-block; }
  details.fold > summary::before { content: "\25B8  "; color: var(--muted); }
  details.fold[open] > summary::before { content: "\25BE  "; }
  details.fold > .prose { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.25rem 1rem; margin-top: 0.5rem; }

  .rels { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .rel { display: grid; grid-template-columns: minmax(12rem, 18rem) minmax(0, 1fr); gap: 0.35rem 1.25rem; padding: 0.8rem 1rem; border-top: 1px solid var(--line); }
  .rel:first-child { border-top: 0; }
  .rel .rid { font: 800 1.35rem/1 var(--display); color: var(--gold-ink); margin-right: 0.4rem; }
  .rel .rname { font-weight: 700; }
  .rel .rtarget { color: var(--muted); font-size: 0.875rem; }
  .rel .rstate { font-size: 0.875rem; margin-top: 0.15rem; }
  .rel .rstate .txt { color: var(--muted); }
  .bar { display: flex; height: 0.9rem; border-radius: 4px; overflow: hidden; background: var(--grid); gap: 2px; }
  .bar > span { min-width: 4px; }
  .counts { display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem; font-size: 0.85rem; margin-top: 0.35rem; color: var(--muted); }
  .counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .counts .cnt { background: none; border: 0; padding: 0; font: inherit; color: var(--link); cursor: pointer; display: inline-flex; align-items: baseline; gap: 0.25rem; text-decoration: underline; text-underline-offset: 0.2em; }
  .counts .cnt b { color: inherit; }
  .counts .cnt[aria-expanded="true"] { color: var(--ink); text-decoration-thickness: 2px; }
  .counts .cnt .sw { margin-right: 0.1rem; align-self: center; }
  .counts .alldone { display: inline-flex; align-items: center; color: var(--ink); }
  ul.rlist { list-style: none; margin: 0.45rem 0 0.2rem; padding: 0.35rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); }
  ul.rlist > li { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 0.1rem 0.6rem; padding: 0.35rem 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
  ul.rlist > li:first-child { border-top: 0; }
  ul.rlist .t { font-weight: 700; overflow-wrap: anywhere; }
  ul.rlist .d { grid-column: 2; color: var(--muted); font-size: 0.825rem; overflow-wrap: anywhere; }
  @media (max-width: 480px) { ul.rlist > li { grid-template-columns: auto minmax(0, 1fr); } }
  .rel details { font-size: 0.85rem; margin-top: 0.3rem; }
  .rel details > summary { color: var(--muted); display: inline-block; }
  .rel details > summary::before { content: "\25B8  "; }
  .rel details[open] > summary::before { content: "\25BE  "; }
  .rel details > summary:hover { color: var(--ink); }
  .rel details .prose p { margin: 0.3rem 0; }
  @media (max-width: 640px) { .rel { grid-template-columns: minmax(0, 1fr); } }

  ol.next { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  ol.next li { display: flex; gap: 0.55rem; align-items: baseline; padding: 0.35rem 0; border-top: 1px solid var(--line); counter-increment: n; min-width: 0; }
  ol.next li:first-child { border-top: 0; padding-top: 0; }
  ol.next li::before { content: counter(n); font: 800 1.05rem/1 var(--display); color: var(--muted); min-width: 0.9rem; }
  ol.next .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  ol.next .r { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  /* Today's "Next (C), in order": the bold lead as the title, the rest on one muted line, all of it on open */
  ol.prio > li { display: block; padding-left: 1.45rem; position: relative; }
  ol.prio > li::before { position: absolute; left: 0; top: 0.4rem; }
  ol.prio > li:first-child::before { top: 0; }
  .prio details > summary { display: block; }
  .prio .pt { font-weight: 700; }
  .prio .pd { display: block; color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  .prio details[open] .pd { display: none; }
  .prio .full { font-size: 0.9rem; margin-top: 0.2rem; overflow-wrap: anywhere; }
  ul.pnotes { list-style: none; margin: 0.5rem 0 0; padding: 0.4rem 0 0; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
  ul.pnotes li { padding: 0.15rem 0; overflow-wrap: anywhere; }
  ul.pnotes strong { color: var(--ink); }

  ol.prio.plain > li { padding-left: 0; }
  ol.prio.plain > li::before, ul.prio.plain > li::before { content: none; }
  ul.next.prio.plain { list-style: none; margin: 0; padding: 0; }
  ul.prio.plain > li { display: block; padding: 0.35rem 0; border-top: 1px solid var(--line); }
  ul.prio.plain > li:first-child { border-top: 0; padding-top: 0; }
  .atag { margin-left: 0.45rem; color: var(--muted); font-size: 0.75rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 0.3rem; white-space: nowrap; vertical-align: 0.1em; }

  .areas { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .area { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 0.5rem 1.5rem; padding: 0.9rem 1rem; border-top: 1px solid var(--line); }
  .area:first-child { border-top: 0; }
  .area .an { font: 800 1.35rem/1.1 var(--display); color: var(--gold-ink); letter-spacing: 0.02em; }
  .area .as { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.45rem; }
  .ameasure { overflow-wrap: anywhere; }
  .abig { display: block; font: 800 2.1rem/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .arest { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; line-height: 1.35; }
  .adue { font-size: 0.825rem; margin: 0.5rem 0 0; overflow-wrap: anywhere; }
  .lplan { margin: 0 0 0.6rem; font-size: 0.925rem; max-width: 52rem; overflow-wrap: anywhere; }
  .lcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 1rem; }
  .lcols h4, .later h4 { margin: 0 0 0.25rem; font: 700 0.8rem var(--body); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  /* the id and title flow as one line of text that wraps under itself; the swatch hangs in the margin */
  ul.litems { list-style: none; margin: 0; padding: 0; font-size: 0.875rem; }
  ul.litems li { position: relative; padding: 0.15rem 0 0.15rem 1.05rem; overflow-wrap: anywhere; }
  ul.litems .sw { position: absolute; left: 0; top: 0.45em; margin: 0; }
  ul.litems .chipid { margin-right: 0.35rem; }
  ul.litems .w, ul.litems .rl { margin-left: 0.35rem; font-size: 0.7rem; vertical-align: 0.1em; }
  .rl { color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.25rem; white-space: nowrap; }
  .later { margin-top: 0.5rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; }
  .later h4 { margin: 0; }
  .lline { display: inline-flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; font-size: 0.85rem; }
  .lid { white-space: nowrap; }
  .areas .none { color: var(--muted); font-size: 0.85rem; margin: 0; }
  details.area { display: block; padding: 0; }
  details.area > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1rem 0.6rem; padding: 0.65rem 0.85rem; }
  details.area > summary::before { content: "\25B8"; color: var(--muted); }
  details.area[open] > summary::before { content: "\25BE"; }
  details.area > summary .abig { display: inline; font-size: 1.4rem; }
  details.area > summary .snow { flex-basis: 100%; padding-left: 1.1rem; color: var(--muted); font-size: 0.8rem; }
  details.area .aopen { padding: 0 0.85rem 0.8rem; }
  @media (max-width: 760px) { .lcols { grid-template-columns: minmax(0, 1fr); } }

  details.relfold > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; padding: 0.7rem 1rem; }
  details.relfold > summary::before { content: "\25B8"; color: var(--muted); }
  details.relfold[open] > summary::before { content: "\25BE"; }
  details.relfold > summary .sw { align-self: center; margin-right: 0; }
  details.relfold > summary b { font-weight: 700; }
  details.relfold > summary .muted { font-size: 0.875rem; }
  details.relfold[open] > summary { border-bottom: 1px solid var(--line); }
  .rels > .rel + details.relfold, .rels > details.relfold + .rel { border-top: 1px solid var(--line); }
  .meter { margin-top: 0.7rem; }
  .meter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .meter .big { font: 800 2rem/1 var(--display); }
  .meter .of { color: var(--muted); font-size: 0.875rem; }
  .track-bar { position: relative; height: 0.7rem; border-radius: 4px; background: var(--grid); margin: 0.4rem 0 0.25rem; }
  .track-bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--bar); }
  .track-bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .track-bar .mark.from { background: var(--muted); }
  .meter .note { color: var(--muted); font-size: 0.8rem; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--link); font: inherit; font-size: 0.875rem; text-decoration: underline; cursor: pointer; }

  .controls { margin: 0.75rem 0 0.4rem; gap: 0.5rem 0.9rem; }
  .crow { display: flex; flex-wrap: wrap; gap: 0.4rem 0.75rem; align-items: center; width: 100%; }
  .crow .lab { min-width: 3.4rem; margin-right: 0; }
  #search { flex: 0 1 16rem; }
  .group { margin-top: 1.25rem; }
  .group > summary h3 { font: 800 1.15rem/1.2 var(--display); letter-spacing: 0.02em; display: flex; align-items: center; gap: 0.45rem; }
  .group > summary h3::before { content: "\25BE"; color: var(--muted); font-size: 0.85em; }
  .group:not([open]) > summary h3::before { content: "\25B8"; }
  .group > summary h3 .n { color: var(--muted); font: 400 0.85rem var(--body); }
  .group > summary h3 .sub { color: var(--muted); font: 400 0.9rem var(--body); letter-spacing: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--st-other); border-radius: 8px; min-width: 0; }
  .card.done { border-left-color: var(--st-done); } .card.built { border-left-color: var(--st-built); }
  .card.building { border-left-color: var(--st-building); } .card.queued { border-left-color: var(--st-queued); }
  .card.idea { border-left-style: dashed; border-left-color: var(--st-idea); } .card.parked { border-left-style: dashed; border-left-color: var(--st-parked); }
  .card[open] { grid-column: 1 / -1; }
  .card.hit { box-shadow: 0 0 0 2px var(--gold); }
  .card > summary { padding: 0.5rem 0.7rem 0.55rem; display: grid; gap: 0.15rem; }
  .card .l1 { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .card .cid { font-weight: 700; color: var(--gold-ink); }
  .card .l1 .whos { margin-left: auto; display: inline-flex; gap: 0.25rem; }
  .card .ctitle { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .card .l3 { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }
  .card .body { padding: 0 0.7rem 0.7rem; border-top: 1px solid var(--line); font-size: 0.925rem; overflow-wrap: anywhere; }
  .card .body dl { margin: 0.5rem 0 0; display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0.35rem 0.75rem; }
  .card .body dt { color: var(--muted); font-size: 0.8rem; padding-top: 0.15rem; }
  .card .body dd { margin: 0; max-width: 52rem; }
  @media (max-width: 480px) { .card .body dl { grid-template-columns: minmax(0, 1fr); gap: 0 0; } .card .body dd { margin-bottom: 0.4rem; } }
  section.closing > details { margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">BoxRun</a>
    <span class="live" id="live" hidden><span class="dot" id="dot"></span><span id="updated"></span></span>
  </header>
  <nav class="pages" aria-label="Stats pages"><a href="/stats/">Stats</a><a href="/stats/roadmap/" aria-current="page">Roadmap</a><a href="/stats/social/">Social</a><a href="/stats/opinions/">Opinions</a></nav>
  <h1>Roadmap</h1>
  <p class="muted" id="sub">From <code>docs/BOXRUN-ROADMAP.md</code>.</p>

  <section id="ask" hidden>
    <h2>Stats key</h2>
    <p>Paste the stats key. It's in <code>work/boxrun-stats/stats-key.txt</code> in the BoxRun project. This browser keeps it.</p>
    <form id="keyform">
      <input id="key" type="password" autocomplete="off" placeholder="Stats key" aria-label="Stats key" required>
      <button class="go" type="submit">Show the roadmap</button>
    </form>
    <p class="error" id="keyerror" role="alert"></p>
  </section>

  <section id="main" hidden></section>
  <p class="error" id="error" role="alert"></p>
  <p class="small"><button class="plain" id="forget" type="button">Use a different key</button></p>
</div>
<script src="/stats/pages.js"></script>
<script>
  "use strict";
  const { el, $ } = Stats;
  // Bar and legend order; the board shows what's moving first and done last.
  const STATES = ["done", "built", "building", "queued", "idea", "parked", "other"];
  const BOARD = ["building", "built", "queued", "idea", "other", "parked", "done"];
  const view = Stats.prefs("boxrunStatsRoadmap", { state: "all", who: "all", track: "all", q: "", group: "state" });
  const openGroups = {}, openCards = new Set();
  let body = null, ids = new Set(), byId = new Map(), trackOf = new Map(), all = [];
  const href = (id) => (ids.has(id) ? "#" + id : null);
  const text = (spans) => (spans || []).map((s) => s[1]).join("");
  const SVGNS = "http://www.w3.org/2000/svg";
  // Small line icons; fixed shapes only.
  const ICONS = {
    run: [["circle", { cx: 12, cy: 12, r: 9 }], ["path", { d: "M12 3a9 9 0 0 1 0 18z", fill: "currentColor" }]],
    wait: [["circle", { cx: 12, cy: 8, r: 4 }], ["path", { d: "M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" }]],
    next: [["path", { d: "M4 12h15M13 6l6 6-6 6" }]],
    goal: [["circle", { cx: 12, cy: 12, r: 9 }], ["circle", { cx: 12, cy: 12, r: 5 }], ["circle", { cx: 12, cy: 12, r: 1.5, fill: "currentColor" }]],
    check: [["path", { d: "M4 12.5l5 5L20 6.5" }]],
  };
  function icon(name) {
    const s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ico"); s.setAttribute("aria-hidden", "true");
    for (const [tag, attrs] of ICONS[name]) {
      const n = document.createElementNS(SVGNS, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      s.append(n);
    }
    return s;
  }
  const pill = (cls) => el("span", { className: "pill " + cls, text: cls });
  const whoTags = (it) => it.who_set.map((w) => el("span", { className: "w " + w, title: w === "M" ? "Marcus's hands" : "Coordinator and workers", text: w }));
  const idLink = (id) => (href(id) ? el("a", { className: "chipid", href: href(id), text: id }) : el("span", { className: "chipid", text: id }));
  const pct = (x) => (Math.round(x * 1000) / 10).toFixed(1) + "%";
  const shortDay = (s) => String(s || "").replace(/^\d{4}-/, "");

  // A state's text without its own first word, which the pill already says: "built, waits for a pass" -> "waits for a pass".
  function afterWord(s, cls) {
    const m = String(s || "").match(/^\s*([a-z]+)(?![a-z0-9])[\s;,:]*/i);
    return m && m[1].toLowerCase() === cls ? s.slice(m[0].length) : String(s || "");
  }
  // A release cell short enough for a card: "2.2 or 2.3 (building from 11-02, ...)" -> "2.2 or 2.3".
  const relLabel = (it) => it.release_id || String(it.release || "").replace(/\s*\(.*$/, "");

  // One of Today's lists as Next up's rows (11-10 review): the bold lead as the title, one muted line, all of it on open.
  function todayList(list) {
    return el("ul", { className: "next prio plain" }, list.map((inl) => prioRow(inl)));
  }

  function nowSection(d) {
    const out = [];
    const today = d.today || {};
    const parts = today.parts || [];
    out.push(el("h2", null, "Today", today.title ? el("span", { className: "aside", text: today.title.replace(/^Today\s*\(?/, "").replace(/\)$/, "") }) : null));

    // The two boxes show Today's "Building now (C)" and "Needs Marcus" lists as written, nothing inferred.
    const run = el("div", { className: "box run" }, el("h3", null, icon("run"), "Building now", el("span", { className: "w C", text: "C" })));
    if (today.building && today.building.length) run.append(todayList(today.building));

    const wait = el("div", { className: "box wait" }, el("h3", null, icon("wait"), "Needs Marcus", el("span", { className: "w M", text: "M" })));

    const count = (f) => all.filter(f).length;
    const box = (label) => el("div", { className: "chips", role: "group", "aria-label": label });
    const groupBox = el("div", { className: "seg", role: "group", "aria-label": "Group by" });
    const stateBox = box("State"), whoBox = box("Who"), trackBox = box("Track");
    const repick = (fn) => (v) => { fn(v); view.save(); paint(); drawBoard(); };
    function paint() {
      Stats.seg(groupBox, [["state", "State"], ["area", "Area"], ["track", "Track"], ["release", "Release"]], view.p.group, repick((v) => { view.p.group = v; }));
      const states = STATES.filter((s) => count((i) => i.state_class === s));
      Stats.seg(stateBox, [["all", "All", all.length]].concat(states.map((s) => [s, s, count((i) => i.state_class === s)])), view.p.state, repick((v) => { view.p.state = v; }));
      for (const b of stateBox.querySelectorAll("button")) if (b.dataset.v !== "all") b.prepend(el("span", { className: "sw " + b.dataset.v }));
      Stats.seg(whoBox, [["all", "Anyone"], ["M", "M", count((i) => i.who_set.includes("M"))], ["C", "C", count((i) => i.who_set.includes("C"))]], view.p.who, repick((v) => { view.p.who = v; }));
      Stats.seg(trackBox, [["all", "All"]].concat((d.tracks || []).map((t) => [t.id, t.id, t.items.length])), view.p.track, repick((v) => { view.p.track = v; }));
    }
    paint();
    const search = el("input", { id: "search", type: "search", placeholder: "Search ids and text", "aria-label": "Search items", autocomplete: "off", value: view.p.q });
    search.addEventListener("input", () => { view.p.q = search.value; view.save(); drawBoard(); });
    const row = (label, ...kids) => el("div", { className: "crow" }, el("span", { className: "lab", text: label }), ...kids);
    return [el("h2", { id: "board", text: "All items" }),
      el("div", { className: "controls" }, row("Group", groupBox, search), row("State", stateBox), row("Who", whoBox), row("Track", trackBox)),
      el("p", { className: "small muted", id: "shown" }),
      el("div", { id: "groups" })];
  }

  function drawAll() {
    const d = body.doc;
    ids = new Set(d.ids || []);
    all = []; byId = new Map(); trackOf = new Map();
    for (const t of d.tracks || []) for (const it of t.items) {
      // a document converted before short titles: take the text before the first break
      if (!it.title) it.title = text(it.item).split(/ \(|[:.](?=\s|$)/)[0].slice(0, 60);
      all.push(it); byId.set(it.id, it); trackOf.set(it.id, t.id);
    }
    indexAreas(d);
    $("sub").replaceChildren("From ", el("code", { text: d.source || "docs/BOXRUN-ROADMAP.md" }),
      ", last changed " + Stats.when(d.updated) + (d.commit ? " (commit " + d.commit + ")" : "") + ".");
    const kids = [].concat(nowSection(d), nextAndGoal(d), areasSection(d), releasesSection(d), boardSection(d));
    const closing = el("section", { className: "closing" });
    if (d.strategy) {
      const det = el("details", null, el("summary", null, el("h2", { text: d.strategy.title })));
      det.append(Stats.blocks(el("div", { className: "prose" }), d.strategy.blocks, href));
      closing.append(det);
    }
    if (d.intro && d.intro.length) {
      const det = el("details", null, el("summary", null, el("h2", { text: "About the roadmap" })));
      det.append(Stats.blocks(el("div", { className: "prose" }), d.intro, href));
      closing.append(det);
    }
    kids.push(closing);
    $("main").replaceChildren(...kids);
    drawBoard();
  }

  // A link to an item (#FIND-3) opens its card, clearing filters that hide it.
  function reveal() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!body || !/^[A-Z]+-\d+$/.test(id) || !byId.has(id)) return;
    if (!matches(byId.get(id))) { Object.assign(view.p, { state: "all", who: "all", track: "all", q: "" }); view.save(); }
    openCards.add(id);
    drawAll();
    const c = document.getElementById(id);
    if (!c) return;
    const g = c.closest("details.group");
    if (g && !g.open) g.open = true;
    c.scrollIntoView({ block: "center" });
  }
  window.addEventListener("hashchange", reveal);
  Stats.start("roadmap", (b) => { const first = !body; body = b; drawAll(); if (first) reveal(); });
</script>
</body>
</html>

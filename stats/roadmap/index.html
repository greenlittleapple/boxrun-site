<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BoxRun roadmap</title>
<meta name="theme-color" content="#1b1c2c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stats/pages.css">
<style>
  /* a colour per state, always shown next to the state's word */
  :root { --st-done: var(--ok-ink); --st-built: var(--blue-ink); --st-building: var(--gold-ink); --st-queued: #b9a6ff;
          --st-idea: var(--muted); --st-parked: #77749a; --st-other: var(--muted); }
  @media (prefers-color-scheme: light) { :root { --st-queued: #6346c8; --st-parked: #9d9ab8; } }
  .pill.queued { border-color: var(--st-queued); color: var(--st-queued); }
  .sw { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 3px; vertical-align: -0.05em; margin-right: 0.35rem; flex: none; }
  .sw.done, .seg-done { background: var(--st-done); }
  .sw.built, .seg-built { background: var(--st-built); }
  .sw.building, .seg-building { background: var(--st-building); }
  .sw.queued, .seg-queued { background: var(--st-queued); }
  .sw.idea, .seg-idea { background: repeating-linear-gradient(135deg, var(--st-idea) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--st-idea); }
  .sw.parked, .seg-parked { background: repeating-linear-gradient(45deg, var(--st-parked) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--st-parked); }
  .sw.other, .seg-other { background: var(--grid); box-shadow: inset 0 0 0 1px var(--st-other); }
  .ico { width: 1.1rem; height: 1.1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .w { display: inline-block; min-width: 1.35rem; padding: 0 0.3rem; border-radius: 4px; font: 700 0.75rem/1.5 var(--body); text-align: center; border: 1px solid var(--line); color: var(--muted); }
  .w.M { border-color: var(--gold-ink); color: var(--gold-ink); }
  a.chipid { font-weight: 700; text-decoration: none; white-space: nowrap; }
  a.chipid:hover { text-decoration: underline; }
  h2 .aside { font: 400 0.9rem var(--body); color: var(--muted); letter-spacing: 0; margin-left: 0.5rem; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
  @media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.85rem 1rem; min-width: 0; }
  .box > h3 { display: flex; align-items: center; gap: 0.5rem; font: 800 1.15rem/1.2 var(--display); letter-spacing: 0.02em; margin-bottom: 0.55rem; }
  .box > h3 .w { margin-left: auto; }
  .box.run > h3 { color: var(--gold-ink); }
  .box.run { border-top: 3px solid var(--st-building); }
  .box.wait { border-top: 3px solid var(--red-ink); }
  .box.wait > h3 .ico { color: var(--red-ink); }
  .whoset { display: inline-flex; gap: 0.2rem; flex: none; }
  .lead { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.9rem; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  /* A row flows as one paragraph: the tag sits inline before the text and the text wraps under it, so no tag, however
     long, can squeeze the text into a narrow column (Marcus's phone, 11-07: a flex row did, three times). */
  ul.list > li { display: block; padding: 0.4rem 0; border-top: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
  ul.list > li:first-child { border-top: 0; padding-top: 0; }
  ul.list > li > .txt { overflow-wrap: anywhere; }
  ul.list > li > .tag { margin-right: 0.45rem; }
  .tag { font: 700 0.8rem var(--body); color: var(--ink); background: var(--wash); border-radius: 4px; padding: 0 0.35rem; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .donetoday { display: flex; gap: 0.5rem; align-items: baseline; margin: 0.75rem 0 0; color: var(--muted); font-size: 0.9rem; }
  .donetoday .ico { color: var(--st-done); align-self: center; }
  .donetoday b { color: var(--ink); }
  details.fold { margin-top: 0.5rem; }
  details.fold > summary { color: var(--link); font-size: 0.9rem; display: inline-block; }
  details.fold > summary::before { content: "\25B8  "; color: var(--muted); }
  details.fold[open] > summary::before { content: "\25BE  "; }
  details.fold > .prose { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.25rem 1rem; margin-top: 0.5rem; }

  .rels { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .rel { display: grid; grid-template-columns: minmax(12rem, 18rem) minmax(0, 1fr); gap: 0.35rem 1.25rem; padding: 0.8rem 1rem; border-top: 1px solid var(--line); }
  .rel:first-child { border-top: 0; }
  .rel .rid { font: 800 1.35rem/1 var(--display); color: var(--gold-ink); margin-right: 0.4rem; }
  .rel .rname { font-weight: 700; }
  .rel .rtarget { color: var(--muted); font-size: 0.875rem; }
  .rel .rstate { font-size: 0.875rem; margin-top: 0.15rem; }
  .rel .rstate .txt { color: var(--muted); }
  .bar { display: flex; height: 0.9rem; border-radius: 4px; overflow: hidden; background: var(--grid); gap: 2px; }
  .bar > span { min-width: 4px; }
  .counts { display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem; font-size: 0.85rem; margin-top: 0.35rem; color: var(--muted); }
  .counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .counts .cnt { background: none; border: 0; padding: 0; font: inherit; color: var(--link); cursor: pointer; display: inline-flex; align-items: baseline; gap: 0.25rem; text-decoration: underline; text-underline-offset: 0.2em; }
  .counts .cnt b { color: inherit; }
  .counts .cnt[aria-expanded="true"] { color: var(--ink); text-decoration-thickness: 2px; }
  .counts .cnt .sw { margin-right: 0.1rem; align-self: center; }
  .counts .alldone { display: inline-flex; align-items: center; color: var(--ink); }
  ul.rlist { list-style: none; margin: 0.45rem 0 0.2rem; padding: 0.35rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); }
  ul.rlist > li { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 0.1rem 0.6rem; padding: 0.35rem 0; border-top: 1px solid var(--line); font-size: 0.9rem; }
  ul.rlist > li:first-child { border-top: 0; }
  ul.rlist .t { font-weight: 700; overflow-wrap: anywhere; }
  ul.rlist .d { grid-column: 2; color: var(--muted); font-size: 0.825rem; overflow-wrap: anywhere; }
  @media (max-width: 480px) { ul.rlist > li { grid-template-columns: auto minmax(0, 1fr); } }
  .rel details { font-size: 0.85rem; margin-top: 0.3rem; }
  .rel details > summary { color: var(--muted); display: inline-block; }
  .rel details > summary::before { content: "\25B8  "; }
  .rel details[open] > summary::before { content: "\25BE  "; }
  .rel details > summary:hover { color: var(--ink); }
  .rel details .prose p { margin: 0.3rem 0; }
  @media (max-width: 640px) { .rel { grid-template-columns: minmax(0, 1fr); } }

  ol.next { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  ol.next li { display: flex; gap: 0.55rem; align-items: baseline; padding: 0.35rem 0; border-top: 1px solid var(--line); counter-increment: n; min-width: 0; }
  ol.next li:first-child { border-top: 0; padding-top: 0; }
  ol.next li::before { content: counter(n); font: 800 1.05rem/1 var(--display); color: var(--muted); min-width: 0.9rem; }
  ol.next .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  ol.next .r { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  /* Today's "Next (C), in order": the bold lead as the title, the rest on one muted line, all of it on open */
  ol.prio > li { display: block; padding-left: 1.45rem; position: relative; }
  ol.prio > li::before { position: absolute; left: 0; top: 0.4rem; }
  ol.prio > li:first-child::before { top: 0; }
  .prio details > summary { display: block; }
  .prio .pt { font-weight: 700; }
  .prio .pd { display: block; color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  .prio details[open] .pd { display: none; }
  .prio .full { font-size: 0.9rem; margin-top: 0.2rem; overflow-wrap: anywhere; }
  ul.pnotes { list-style: none; margin: 0.5rem 0 0; padding: 0.4rem 0 0; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
  ul.pnotes li { padding: 0.15rem 0; overflow-wrap: anywhere; }
  ul.pnotes strong { color: var(--ink); }

  ol.prio.plain > li { padding-left: 0; }
  ol.prio.plain > li::before, ul.prio.plain > li::before { content: none; }
  ul.next.prio.plain { list-style: none; margin: 0; padding: 0; }
  ul.prio.plain > li { display: block; padding: 0.35rem 0; border-top: 1px solid var(--line); }
  ul.prio.plain > li:first-child { border-top: 0; padding-top: 0; }
  .atag { margin-left: 0.45rem; color: var(--muted); font-size: 0.75rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 0.3rem; vertical-align: 0.1em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

  .areas { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .area { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 0.5rem 1.5rem; padding: 0.9rem 1rem; border-top: 1px solid var(--line); }
  .area:first-child { border-top: 0; }
  .area .an { font: 800 1.35rem/1.1 var(--display); color: var(--gold-ink); letter-spacing: 0.02em; }
  .area .as { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.45rem; }
  .ameasure { overflow-wrap: anywhere; }
  .abig { display: block; font: 800 2.1rem/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .arest { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; line-height: 1.35; }
  .adue { font-size: 0.825rem; margin: 0.5rem 0 0; overflow-wrap: anywhere; }
  .lplan { margin: 0 0 0.6rem; font-size: 0.925rem; max-width: 52rem; overflow-wrap: anywhere; }
  .lcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 1rem; }
  .lcols h4, .later h4 { margin: 0 0 0.25rem; font: 700 0.8rem var(--body); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  /* the id and title flow as one line of text that wraps under itself; the swatch hangs in the margin */
  ul.litems { list-style: none; margin: 0; padding: 0; font-size: 0.875rem; }
  ul.litems li { position: relative; padding: 0.15rem 0 0.15rem 1.05rem; overflow-wrap: anywhere; }
  ul.litems .sw { position: absolute; left: 0; top: 0.45em; margin: 0; }
  ul.litems .chipid { margin-right: 0.35rem; }
  ul.litems .w, ul.litems .rl { margin-left: 0.35rem; font-size: 0.7rem; vertical-align: 0.1em; }
  .rl { color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.25rem; white-space: nowrap; }
  .later { margin-top: 0.5rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; }
  .later h4 { margin: 0; }
  .lline { display: inline-flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; font-size: 0.85rem; }
  .lid { white-space: nowrap; }
  .areas .none { color: var(--muted); font-size: 0.85rem; margin: 0; }
  details.area { display: block; padding: 0; }
  details.area > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1rem 0.6rem; padding: 0.65rem 0.85rem; }
  details.area > summary::before { content: "\25B8"; color: var(--muted); }
  details.area[open] > summary::before { content: "\25BE"; }
  details.area > summary .abig { display: inline; font-size: 1.4rem; }
  details.area > summary .snow { flex-basis: 100%; padding-left: 1.1rem; color: var(--muted); font-size: 0.8rem; }
  details.area .aopen { padding: 0 0.85rem 0.8rem; }
  @media (max-width: 760px) { .lcols { grid-template-columns: minmax(0, 1fr); } }

  details.relfold > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; padding: 0.7rem 1rem; }
  details.relfold > summary::before { content: "\25B8"; color: var(--muted); }
  details.relfold[open] > summary::before { content: "\25BE"; }
  details.relfold > summary .sw { align-self: center; margin-right: 0; }
  details.relfold > summary b { font-weight: 700; }
  details.relfold > summary .muted { font-size: 0.875rem; }
  details.relfold[open] > summary { border-bottom: 1px solid var(--line); }
  .rels > .rel + details.relfold, .rels > details.relfold + .rel { border-top: 1px solid var(--line); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--link); font: inherit; font-size: 0.875rem; text-decoration: underline; cursor: pointer; }

  .controls { margin: 0.75rem 0 0.4rem; gap: 0.5rem 0.9rem; }
  .crow { display: flex; flex-wrap: wrap; gap: 0.4rem 0.75rem; align-items: center; width: 100%; }
  .crow .lab { min-width: 3.4rem; margin-right: 0; }
  #search { flex: 0 1 16rem; }
  .group { margin-top: 1.25rem; }
  .group > summary h3 { font: 800 1.15rem/1.2 var(--display); letter-spacing: 0.02em; display: flex; align-items: center; gap: 0.45rem; }
  .group > summary h3::before { content: "\25BE"; color: var(--muted); font-size: 0.85em; }
  .group:not([open]) > summary h3::before { content: "\25B8"; }
  .group > summary h3 .n { color: var(--muted); font: 400 0.85rem var(--body); }
  .group > summary h3 .sub { color: var(--muted); font: 400 0.9rem var(--body); letter-spacing: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--st-other); border-radius: 8px; min-width: 0; }
  .card.done { border-left-color: var(--st-done); } .card.built { border-left-color: var(--st-built); }
  .card.building { border-left-color: var(--st-building); } .card.queued { border-left-color: var(--st-queued); }
  .card.idea { border-left-style: dashed; border-left-color: var(--st-idea); } .card.parked { border-left-style: dashed; border-left-color: var(--st-parked); }
  .card[open] { grid-column: 1 / -1; }
  .card.hit { box-shadow: 0 0 0 2px var(--gold); }
  .card > summary { padding: 0.5rem 0.7rem 0.55rem; display: grid; gap: 0.15rem; }
  .card .l1 { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .card .cid { font-weight: 700; color: var(--gold-ink); }
  .card .l1 .whos { margin-left: auto; display: inline-flex; gap: 0.25rem; }
  .card .ctitle { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .card .l3 { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }
  .card .body { padding: 0 0.7rem 0.7rem; border-top: 1px solid var(--line); font-size: 0.925rem; overflow-wrap: anywhere; }
  .card .body dl { margin: 0.5rem 0 0; display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0.35rem 0.75rem; }
  .card .body dt { color: var(--muted); font-size: 0.8rem; padding-top: 0.15rem; }
  .card .body dd { margin: 0; max-width: 52rem; }
  @media (max-width: 480px) { .card .body dl { grid-template-columns: minmax(0, 1fr); gap: 0 0; } .card .body dd { margin-bottom: 0.4rem; } }
  section.closing > details { margin-top: 1.5rem; }
  /* ---- the Big picture (growth review 7, 11-11): three parts under the map, and the players chart in a fold near the
     page's end; the maths in /stats/picture.js ---- */
  nav.jump { display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; margin: 0.35rem 0 0.1rem; font-size: 0.9rem; }
  .bp h3.bph { font: 800 1.2rem/1.2 var(--display); letter-spacing: 0.02em; margin: 1.6rem 0 0.6rem; }
  .bp > .bpart:first-of-type h3.bph { margin-top: 0.4rem; }
  .bp .panel { min-width: 0; }
  .bpline { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.35rem; max-width: 62rem; overflow-wrap: anywhere; }
  .bpline strong { color: var(--ink); font-weight: 700; }
  .rt { position: relative; margin: 0.5rem 0 0.35rem; }
  .rt > * { position: absolute; }
  .rline, .rdone { border-radius: 2px; }
  .rline { background: var(--line); }
  .rdone { background: var(--bar); box-shadow: 0 0 8px var(--wash); }
  .ring { width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--line); background: var(--panel); }
  .ring.passed { border-color: var(--bar); }
  .rnow { width: 14px; height: 14px; border-radius: 50%; background: var(--bar); box-shadow: 0 0 0 3px var(--panel), 0 0 10px var(--bar); }
  .rnowlab { font: 700 0.8rem/18px var(--body); color: var(--gold-ink); white-space: nowrap; }
  .rtick { background: var(--muted); }
  .rplan { font-size: 0.75rem; line-height: 16px; color: var(--muted); white-space: nowrap; }
  .rstem { width: 1px; background: var(--muted); opacity: 0.55; }
  .rlab { overflow-wrap: anywhere; }
  .rlab .rd { display: block; font: 800 1.25rem/1.1 var(--display); letter-spacing: 0.02em; }
  .rlab .rn { display: block; font-weight: 700; font-size: 0.9rem; line-height: 1.3; }
  .rlab .rx { display: block; color: var(--muted); font-size: 0.8rem; line-height: 1.35; margin-top: 0.1rem; }
  .rlab.mid { text-align: center; }
  .rlab.end { text-align: right; }
  .pin { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--gold-ink); background: var(--panel); color: var(--ink);
         font: 700 0.72rem/1 var(--body); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
         font-variant-numeric: tabular-nums; vertical-align: middle; }
  button.pin:hover, .pin.on { background: var(--bar); border-color: var(--bar); color: var(--night); }
  span.pin { cursor: default; }
  .rread { min-height: 1.5em; margin: 0.35rem 0 0; font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
  .rread b { color: var(--ink); }

  .splits { margin-top: 0.9rem; border-top: 1px solid var(--line); }
  .sp { display: grid; grid-template-columns: minmax(10rem, 15rem) minmax(8rem, 1fr) 5rem 11.5rem 10rem; gap: 0.15rem 1rem;
        align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .sp:last-child { border-bottom: 0; }
  .sp.head { color: var(--muted); font-size: 0.78rem; padding: 0.4rem 0; }
  .spm { font-weight: 700; line-height: 1.3; }
  .spbar { position: relative; height: 0.65rem; background: var(--grid); border-radius: 3px; margin-top: 0.7rem; }
  .spfill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 3px; }
  .spghost { position: absolute; top: -4px; bottom: -4px; width: 8px; margin-left: -4px; border: 2px solid var(--blue-ink); border-radius: 3px; background: var(--panel); }
  .spgl { position: absolute; bottom: calc(100% + 1px); left: 50%; transform: translateX(-50%); font-size: 0.65rem; line-height: 1; color: var(--blue-ink); }
  .spn { font: 800 1.25rem/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
  .spd { font-size: 0.85rem; }
  .spd.ahead { color: var(--ok-ink); }
  .spd.behind { color: var(--red-ink); }
  .spd.none, .spt { color: var(--muted); font-size: 0.85rem; }
  @media (max-width: 600px) {
    .sp { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "m m" "b b" "n d" "t t"; gap: 0.2rem 0.75rem; }
    .sp.head { display: none; }
    .spm { grid-area: m; } .spbar { grid-area: b; } .spn { grid-area: n; text-align: left; } .spd { grid-area: d; } .spt { grid-area: t; }
  }

  .chip { display: inline-block; margin-top: 0.4rem; padding: 0 0.4rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; line-height: 1.5;
          border: 1px solid var(--line); color: var(--muted); }
  .chip.good { border-color: var(--ok-ink); color: var(--ok-ink); }
  .chip.problem { border-color: var(--red-ink); color: var(--red-ink); }
  .chip.open { border-style: dashed; }
  .lbl { color: var(--muted); }

  .pchart { position: relative; }
  .pchart svg { display: block; width: 100%; overflow: visible; }
  .pchart svg:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .pchart text { fill: var(--muted); font: 11px var(--body); }
  .bpc .grid { stroke: var(--grid); }
  .bpc .ret { fill: var(--s1); } .bpc .new { fill: var(--s2); }
  .bpc .ret.partial { fill: none; stroke: var(--s1); stroke-width: 1.5; } .bpc .new.partial { fill: none; stroke: var(--s2); stroke-width: 1.5; }
  .bpc .hatchline { stroke: var(--muted); stroke-width: 2; }
  .bpc .hatch { stroke: var(--muted); stroke-width: 1; }
  .bpc .short { fill: var(--wash); stroke: var(--gold-ink); stroke-width: 1.5; }
  .bpc .short.unknown { fill: none; }
  .bpc .other { fill: none; stroke: var(--blue-ink); stroke-width: 1.5; stroke-dasharray: 3 2; }

           white-space: nowrap; color: var(--muted); }

  .dline { display: block; font-size: 0.85rem; margin-top: 0.15rem; }

  .alts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
  .alt h4 { margin: 0 0 0.3rem; font: 800 1.2rem/1.2 var(--display); letter-spacing: 0.02em; }
  .alt p { margin: 0.3rem 0 0; font-size: 0.875rem; overflow-wrap: anywhere; }
  .alt .what { color: var(--ink); }
  @media (max-width: 760px) { .alts { grid-template-columns: minmax(0, 1fr); } }
  .bpsrc { margin: 1rem 0 0; }
  /* ---- the map: a line per track, its sub-tracks branching off it ---- */
  :root { --tk1: #ffd23f; --tk2: #62e4ef; --tk3: #78e08f; --tk4: #ff9f6e; --tk5: #c59bff; --tk6: #ff7d7d; --tk7: #a9a6c4; }
  @media (prefers-color-scheme: light) { :root { --tk1: #946a00; --tk2: #0b6f9e; --tk3: #22743a; --tk4: #b4530e; --tk5: #6b3fc4; --tk6: #b42318; --tk7: #5d5a78; } }
  .tm .tmlead { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.8rem; margin: 0.8rem 0 0.6rem; }
  .tm .tmlead > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.8rem; }
  .tm .tmlead b { display: block; font: 800 1.7rem/1.1 var(--display); letter-spacing: 0.02em; }

  .tm .tmgrid { display: grid; grid-template-columns: minmax(0, 2.3fr) repeat(var(--n, 3), minmax(0, 1fr)) minmax(0, 1.5fr); column-gap: 1rem; }
  .tm .tmgrid > div { position: relative; min-width: 0; }
  .tm .tmcols { margin-top: 1rem; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .tm .tmkey { margin: 0.3rem 0 0; }
  .tm .tmkey .tmdots { display: inline-block; margin: 0 0.2rem 0 0.7rem; vertical-align: -1px; }
  .tm .tmtrack { margin-top: 1.6rem; }
  .tm .tmhead, .tm .tmsubhead { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .tm .tmhead:hover .tmname, .tm .tmsubhead:hover .tmsubname { text-decoration: underline; }
  .tm .tmname { font: 800 1.5rem/1.1 var(--display); letter-spacing: 0.03em; color: var(--tk); margin-right: 0.5rem; }
  .tm .tmwhat { color: var(--muted); }
  .tm .tmhead .chip, .tm .tmsubhead .chip { margin: 0 0.5rem 0 0; vertical-align: 0.1em; }
  .tm .pin { display: inline-block; text-align: center; font: 700 0.75rem/19px var(--body); margin-left: 0.3rem; vertical-align: 0.1em; }
  /* the line: a thick rule in the track's colour, with a stop at each column that holds a goal and at its end */
  .tm .tmline { border-top: 5px solid var(--tk); margin-top: 0.45rem; padding-top: 0.7rem; }
  .tm .tmline > .stop::before { content: ""; position: absolute; left: 0; top: calc(-0.7rem - 10px); width: 9px; height: 9px; border-radius: 50%;
                                background: var(--night); border: 3px solid var(--tk); }
  .tm .tmline > .end::before { background: var(--tk); }
  .tm .tmline > div:first-child { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 1rem; align-content: start; }
  .tm .tmnum { display: block; }
  .tm .tmnum b { display: block; font: 800 1.35rem/1.1 var(--display); letter-spacing: 0.02em; }
  .tm .tmnum span { display: block; color: var(--muted); font-size: 0.82rem; line-height: 1.3; }
  .tm .tmnum .vs { color: var(--ink); }
  .tm .tmgoal, .tm .tmend { margin: 0 0 0.35rem; font-size: 0.85rem; line-height: 1.35; }
  .tm .tmgoal .when, .tm .tmcol { color: var(--muted); font-weight: 700; }
  .tm .tmcol { display: none; }
  .tm .tmfeeds { margin: 0.4rem 0 0; font-size: 0.85rem; color: var(--muted); line-height: 1.9; }
  .tm .tk { display: inline-block; padding: 0 0.4rem; margin: 0 0.3rem 0 0; border-radius: 4px; border: 1px solid var(--tkc, var(--line)); color: var(--ink);
            font-weight: 700; font-size: 0.82rem; line-height: 1.5; text-decoration: none; }
  .tm a.tk:hover { background: var(--wash); }
  .tm ul.tmsubs { list-style: none; margin: 0.6rem 0 0; padding: 0; }
  /* the branch: the track's colour runs down the left and turns in at each sub-track */
  .tm .tmsub { position: relative; padding: 0.5rem 0; }
  .tm .tmsub::before { content: ""; position: absolute; left: 0.35rem; top: 0; bottom: 0; border-left: 3px solid var(--tk); }
  .tm .tmsub:last-child::before { bottom: auto; height: 1.2rem; }
  .tm .tmsub::after { content: ""; position: absolute; left: 0.35rem; top: 1.2rem; width: 0.9rem; border-top: 3px solid var(--tk); }
  .tm .tmsub > .tmgrid > .tmsubtop, .tm .tmsub > .tmgrid > .tmsubdots, .tm .tmsub > .tmpanel { margin-left: 1.7rem; }
  /* a sub-track: its name and next goal, its done items as dots under them, and its open items in rows beside them */
  .tm .tmsub > .tmgrid { grid-template-rows: auto 1fr; }
  .tm .tmsubtop { grid-column: 1; grid-row: 1; }
  .tm .tmsubdots { grid-column: 1; grid-row: 2; }
  .tm .tmrows { grid-column: 2 / -1; grid-row: 1 / span 2; font-size: 0.85rem; line-height: 1.4; }
  .tm .tmsubname { font-weight: 700; margin-right: 0.5rem; }
  .tm .tmsubgoal { margin: 0.1rem 0 0; font-size: 0.85rem; line-height: 1.35; overflow-wrap: anywhere;
                   display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .tm .tmsubgoal .when { color: var(--muted); font-weight: 700; }
  /* the group's word hangs left of its rows; a row flows as one paragraph (id, title, state word) and opens its item */
  .tm .tmgrp { display: grid; grid-template-columns: 2.9rem minmax(0, 1fr); }
  .tm .tmgl { color: var(--muted); font-size: 0.8rem; font-weight: 700; padding-top: 0.2rem; }
  .tm .tmrow > summary { display: block; padding: 0.15rem 0; overflow-wrap: anywhere; }
  .tm .tmrow > summary:hover .rid, .tm .tmrow[open] > summary .rid { text-decoration: underline; }
  .tm .tmrow .rid { font-weight: 700; color: var(--link); white-space: nowrap; }
  .tm .tmrow .st { font-weight: 700; font-size: 0.8rem; white-space: nowrap; }
  .tm .tmrow .full { margin: 0.1rem 0 0.45rem; padding: 0.45rem 0.7rem; background: var(--panel); border: 1px solid var(--line);
                     border-left: 3px solid var(--tk); border-radius: 6px; overflow-wrap: anywhere; }
  .tm .tmrow .full p { margin: 0 0 0.3rem; }
  .tm .tmrow .full p:last-child { margin-bottom: 0; }
  .tm .tmrow .src { color: var(--muted); font-size: 0.82rem; }
  .tm .needs { font-size: 0.75rem; font-weight: 700; color: var(--gold-ink); margin-left: 0.4rem; white-space: nowrap; }
  .tm .tmdots { display: block; margin-top: 0.3rem; line-height: 0; }
  .tm .tmdots i { display: inline-block; box-sizing: border-box; width: 9px; height: 9px; border-radius: 50%; margin: 0 3px 3px 0; background: var(--st-done); opacity: 0.55; }
  .tm .tmdots i.bar { width: 2px; height: 13px; border-radius: 0; background: var(--muted); margin: 0 5px 1px 2px; opacity: 1; }
  .tm .tmdots i.now { background: var(--tk, var(--ink)); opacity: 1; }

  .tm .tmdots i.later { background: none; border: 1.5px solid var(--tk, var(--ink)); opacity: 1; }
  .tm .tmdots i.parked { background: none; border: 1.5px dashed var(--st-parked); opacity: 1; }
  /* in a sub-track a dot is a button a little larger than its mark; the picked item is named under the dots */
  .tm .tmdots i, .tm .tmdot { vertical-align: top; }
  .tm .tmdot { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; margin: 0 0 1px -1px; background: none; border: 0; padding: 0; cursor: pointer; }
  .tm .tmdot i { margin: 0; }
  .tm .tmdot:hover i, .tm .tmdot[aria-pressed="true"] i { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
  .tm .tmsub .tmdots { margin-left: -1px; }
  .tm .tmsub .tmdots i.bar { margin: 0 4px 1px 3px; }
  .tm .tmitem { display: block; font-size: 0.85rem; line-height: 1.4; margin-top: 0.15rem; overflow-wrap: anywhere; }
  .tm .tmitem .st { font-weight: 700; font-size: 0.8rem; }
  .tm .tmpanel { margin: 0.7rem 0 0.3rem; padding: 0.8rem 1rem; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--tk); border-radius: 6px; }
  .tm .tmpanel h4 { font: 700 0.8rem var(--body); color: var(--muted); margin: 0.9rem 0 0.25rem; }
  .tm .tmpanel h4:first-child { margin-top: 0; }
  .tm .tmpanel p, .tm .tmpanel li { margin: 0 0 0.3rem; font-size: 0.92rem; line-height: 1.45; }
  .tm .tmpanel ul { margin: 0; padding-left: 1.1rem; }
  .tm .tmpanel .src { color: var(--muted); font-size: 0.82rem; }
  .tm .tmpanel .st { font-weight: 700; font-size: 0.8rem; }
  .tm h3.tmh { font: 800 1.2rem/1.2 var(--display); letter-spacing: 0.02em; margin: 2rem 0 0.5rem; }
  .tm .tmfeedsvg { display: block; width: 100%; max-width: 1000px; height: auto; margin: 0.4rem 0 1rem; }
  .tm .tmfeedsvg text { font: 700 14px var(--body); fill: var(--ink); }
  .tm .tmfeedsvg text.rail { font-weight: 600; font-size: 13px; }
  .tm .tmfeedsvg .tmpill { cursor: pointer; }
  @media (max-width: 700px) { .tm .tmfeedsvg { display: none; } }
  .tm ul.tmfeedlist { list-style: none; margin: 0; padding: 0; }
  .tm ul.tmfeedlist li { margin: 0 0 0.35rem; font-size: 0.92rem; line-height: 1.8; }
  @media (max-width: 900px) {
    .tm .tmlead { grid-template-columns: minmax(0, 1fr); }
    .tm .tmgrid { display: block; }

    .tm .tmcol { display: inline; }
    .tm .tmgrid > div + div { margin-top: 0.3rem; }
    /* a sub-track's blocks stack here: its name and goal, its rows, its dots */
    .tm .tmsub > .tmgrid > div { margin-left: 1.7rem; }

    .tm .tmdot { width: 20px; height: 20px; margin: 0 1px 2px -4px; }
    .tm .tmdot i { width: 12px; height: 12px; }
    .tm .tmsub .tmdots { margin-left: 0; }
    .tm .tmsub .tmdots i.bar { height: 18px; margin: 1px 6px 2px 2px; }
  }
</style>

<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">BoxRun</a>
    <span class="live" id="live" hidden><span class="dot" id="dot"></span><span id="updated"></span></span>
  </header>
  <nav class="pages" aria-label="Stats pages"><a href="/stats/">Stats</a><a href="/stats/roadmap/" aria-current="page">Roadmap</a><a href="/stats/social/">Social</a><a href="/stats/opinions/">Opinions</a></nav>
  <h1>Roadmap</h1>
  <nav class="jump" aria-label="On this page"><a href="#today">Today</a><a href="#releases">Releases</a><a href="#map" id="jump-map" hidden>Map</a><a href="#big-picture" id="jump-bp" hidden>Big picture</a><a href="#areas" id="jump-areas" hidden>Areas</a><a href="#board">All items</a><a href="#history" id="jump-history" hidden>Players and posts</a><a href="#strategy" id="jump-strategy" hidden>Strategy</a></nav>
  <p class="muted" id="sub">From <code>docs/BOXRUN-ROADMAP.md</code>.</p>

  <section id="ask" hidden>
    <h2>Stats key</h2>
    <p>Paste the stats key. It's in <code>work/boxrun-stats/stats-key.txt</code> in the BoxRun project. This browser keeps it.</p>
    <form id="keyform">
      <input id="key" type="password" autocomplete="off" placeholder="Stats key" aria-label="Stats key" required>
      <button class="go" type="submit">Show the roadmap</button>
    </form>
    <p class="error" id="keyerror" role="alert"></p>
  </section>

  <section id="main" hidden></section>
  <p class="error" id="error" role="alert"></p>
  <p class="small"><button class="plain" id="forget" type="button">Use a different key</button></p>
</div>
<script src="/stats/pages.js"></script>
<script src="/stats/picture.js"></script>
<script src="/stats/trackmap.js"></script>
<script>
  "use strict";
  const { el, $ } = Stats;
  // Bar and legend order; the board shows what's moving first and done last.
  const STATES = ["done", "built", "building", "queued", "idea", "parked", "other"];
  const BOARD = ["building", "built", "queued", "idea", "other", "parked", "done"];
  const view = Stats.prefs("boxrunStatsRoadmap", { state: "all", who: "all", track: "all", q: "", group: "state" });
  const openGroups = {}, openCards = new Set();
  let body = null, ids = new Set(), byId = new Map(), trackOf = new Map(), all = [];
  const href = (id) => (ids.has(id) ? "#" + id : null);
  const hasAreas = () => !!(body && body.doc.areas && (body.doc.areas.areas || []).length);
  const text = (spans) => (spans || []).map((s) => s[1]).join("");
  const SVGNS = "http://www.w3.org/2000/svg";
  // Small line icons; fixed shapes only.
  const ICONS = {
    run: [["circle", { cx: 12, cy: 12, r: 9 }], ["path", { d: "M12 3a9 9 0 0 1 0 18z", fill: "currentColor" }]],
    wait: [["circle", { cx: 12, cy: 8, r: 4 }], ["path", { d: "M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" }]],
    next: [["path", { d: "M4 12h15M13 6l6 6-6 6" }]],
    check: [["path", { d: "M4 12.5l5 5L20 6.5" }]],
  };
  function icon(name) {
    const s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ico"); s.setAttribute("aria-hidden", "true");
    for (const [tag, attrs] of ICONS[name]) {
      const n = document.createElementNS(SVGNS, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      s.append(n);
    }
    return s;
  }
  const pill = (cls) => el("span", { className: "pill " + cls, text: cls });
  const whoTags = (it) => it.who_set.map((w) => el("span", { className: "w " + w, title: w === "M" ? "Marcus's hands" : "Coordinator and workers", text: w }));
  const idLink = (id) => (href(id) ? el("a", { className: "chipid", href: href(id), text: id }) : el("span", { className: "chipid", text: id }));
  const pct = (x) => (Math.round(x * 1000) / 10).toFixed(1) + "%";

  // A state's text without its own first word, which the pill already says: "built, waits for a pass" -> "waits for a pass".
  function afterWord(s, cls) {
    const m = String(s || "").match(/^\s*([a-z]+)(?![a-z0-9])[\s;,:]*/i);
    return m && m[1].toLowerCase() === cls ? s.slice(m[0].length) : String(s || "");
  }
  // A release cell short enough for a card: "2.2 or 2.3 (building from 11-02, ...)" -> "2.2 or 2.3".
  const relLabel = (it) => it.release_id || String(it.release || "").replace(/\s*\(.*$/, "");

  // One of Today's lists as Next up's rows (11-10 review): the bold lead as the title, one muted line, all of it on open.
  function todayList(list) {
    return el("ul", { className: "next prio plain" }, list.map((inl) => prioRow(inl)));
  }

  function nowSection(d) {
    const out = [];
    const today = d.today || {};
    const parts = today.parts || [];
    out.push(el("h2", { id: "today" }, "Today", today.title ? el("span", { className: "aside", text: today.title.replace(/^Today\s*\(?/, "").replace(/\)$/, "") }) : null));

    // The two boxes show Today's "Building now (C)" and "Needs Marcus" lists as written, nothing inferred.
    const run = el("div", { className: "box run" }, el("h3", null, icon("run"), "Building now", el("span", { className: "w C", text: "C" })));
    if (today.building && today.building.length) run.append(todayList(today.building));
    else run.append(el("p", { className: "lead", text: "Nothing is being built right now." }));
    const wait = el("div", { className: "box wait" }, el("h3", null, icon("wait"), "Needs Marcus", el("span", { className: "w M", text: "M" })));
    if (today.needs && today.needs.length) wait.append(todayList(today.needs));
    else wait.append(el("p", { className: "lead", text: "Nothing needs Marcus right now." }));
    out.push(el("div", { className: "cols" }, run, wait));

    for (const p of parts.filter((x) => x.kind === "done")) {
      out.push(el("p", { className: "donetoday" }, icon("check"), el("span", null, el("b", { text: p.label + ": " }), Stats.spans(el("span"), p.inl, href))));
    }
    if (today.blocks && today.blocks.length) {
      const det = el("details", { className: "fold" }, el("summary", { text: "Today in full" }));
      det.append(Stats.blocks(el("div", { className: "prose" }), today.blocks, href));
      out.push(det);
    }
    return out;
  }

  function counts(list) {
    const c = {};
    for (const it of list) c[it.state_class] = (c[it.state_class] || 0) + 1;
    return c;
  }
  function stateBar(c, total) {
    const bar = el("div", { className: "bar", role: "img",
      "aria-label": STATES.filter((s) => c[s]).map((s) => c[s] + " " + s).join(", ") });
    for (const s of STATES) if (c[s]) bar.append(el("span", { className: "seg-" + s, style: "flex: " + c[s] + " 1 0" }));
    return bar;
  }
  // A release's counts. Each opens the list of the release's items in that state: id, title, the state's detail.
  const openRel = {};
  function relCounts(r, items, c) {
    const key = r.id || r.name;
    const list = el("ul", { className: "rlist", id: "rl-" + String(key).replace(/[^A-Za-z0-9]/g, "_") });
    const btns = [];
    function show() {
      const s = openRel[key];
      for (const b of btns) b.setAttribute("aria-expanded", String(b.dataset.s === s));
      list.hidden = !s;
      list.replaceChildren(...(s ? items.filter((it) => it.state_class === s).map((it) => el("li", null,
        el("a", { className: "chipid", href: "#" + it.id, text: it.id,
          on: { click: (e) => { if (location.hash === "#" + it.id) { e.preventDefault(); reveal(); } } } }),
        el("span", { className: "t", text: it.title }),
        it.state_line ? el("span", { className: "d", text: it.state_line }) : null)) : []));
    }
    for (const s of STATES.filter((x) => c[x])) {
      btns.push(el("button", { type: "button", className: "cnt", "data-s": s, "aria-controls": list.id,
        on: { click: () => { openRel[key] = openRel[key] === s ? null : s; show(); } } },
        el("span", { className: "sw " + s }), el("b", { text: c[s] }), s));
    }
    show();
    return [el("div", { className: "counts" }, btns), list];
  }

  // The day a release went out, from its Target ("released Mon 11-09 ~15:45 PST" -> "Mon 11-09").
  const relDay = (r) => { const m = text(r.target).match(/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+\d{1,2}-\d{1,2}\b/); return m ? m[0] : ""; };
  function releasesSection(d) {
    const out = [el("h2", { id: "releases", text: "Releases" })];
    const box = el("div", { className: "rels" });
    const rels = d.releases || [];
    const done = rels.filter((r) => r.state_class === "done");
    // What's ahead first; under it every finished release in one fold, closed by default: "10 done", then the newest by date.
    for (const r of rels.filter((x) => x.state_class !== "done")) box.append(relRow(r));
    if (done.length) {
      // the newest by the date in its Target (the table is in date order since 11-10, but don't rely on it)

    const box = el("div", { className: "bpart" }, el("h3", { className: "bph", text: "The " + (list.length === 10 ? "ten" : list.length) + " decisions and when each gets checked" }),
      el("div", { className: "panel" }, ol, S.undated.length ? el("h4", { className: "muted", style: "margin: 0.9rem 0 0.2rem; font: 700 0.9rem var(--body)", text: "When something happens" }) : null,
        S.undated.length ? el("ol", { className: "decs" }, S.undated.map(row)) : null));
    return box;
  }

  // ---- c. next to the alternatives ----
  function altPart(p) {
    return el("div", { className: "bpart" }, el("h3", { className: "bph", text: "Next to the alternatives" }),
      el("div", { className: "alts", id: "bp-alts" }, p.alternatives.map((a) => el("div", { className: "panel alt" },
        el("h4", { text: a.tool }), el("p", { className: "what", text: a.what }),
        el("p", null, el("span", { className: "lbl", text: "How you start it: " }), a.start),
        el("p", null, el("span", { className: "lbl", text: "It leads on: " }), a.leads),
        el("p", null, el("span", { className: "lbl", text: "BoxRun leads on: " }), a.boxrun_leads)))));
  }

  function drawAll() {
    const d = body.doc;
    ids = new Set(d.ids || []);
    all = []; byId = new Map(); trackOf = new Map();
    for (const t of d.tracks || []) for (const it of t.items) {
      // a document converted before short titles: take the text before the first break
      if (!it.title) it.title = text(it.item).split(/ \(|[:.](?=\s|$)/)[0].slice(0, 60);
      all.push(it); byId.set(it.id, it); trackOf.set(it.id, t.id);
    }
    indexAreas(d);
    // a roadmap without Areas (the Map holds the plan since 11-11): no link, and no grouping by area
    $("jump-areas").hidden = !hasAreas();
    if (!hasAreas() && view.p.group === "area") view.p.group = "state";
    $("sub").replaceChildren("From ", el("code", { text: d.source || "docs/BOXRUN-ROADMAP.md" }),
      ", last changed " + Stats.when(d.updated) + (d.commit ? " (commit " + d.commit + ")" : "") + ".");
    $("jump-bp").hidden = !d.picture;
    $("jump-history").hidden = !d.picture;
    $("jump-strategy").hidden = !d.strategy;
    // Today and Next up first (Marcus 11-11), then the Map and the Big picture; what records the past (the finished
    // releases, the players chart, Strategy) sits under them in closed folds
    // Today and Next up, then Releases (Marcus 11-11), then the Map and the Big picture
    const kids = [].concat(nowSection(d), nextAndGoal(d), releasesSection(d), mapSection(d), bigPicture(d), areasSection(d), boardSection(d));
    const closing = el("section", { className: "closing" });
    const hist = historyFold(d.picture);
    if (hist) closing.append(hist);
    if (d.strategy) {
      const det = el("details", { id: "strategy" }, el("summary", null, el("h2", { text: d.strategy.title })));
      det.append(Stats.blocks(el("div", { className: "prose" }), d.strategy.blocks, href));
      closing.append(det);
    }
    if (d.intro && d.intro.length) {
      const det = el("details", null, el("summary", null, el("h2", { text: "About the roadmap" })));
      det.append(Stats.blocks(el("div", { className: "prose" }), d.intro, href));
      closing.append(det);
    }
    kids.push(closing);
    $("main").replaceChildren(...kids);
    drawBoard();
    layoutPicture();
  }

  // A link to an item (#FIND-3) opens its card, clearing filters that hide it.
  function reveal() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!body || !/^[A-Z]+-\d+$/.test(id) || !byId.has(id)) return;
    if (!matches(byId.get(id))) { Object.assign(view.p, { state: "all", who: "all", track: "all", q: "" }); view.save(); }
    openCards.add(id);
    drawAll();
    const c = document.getElementById(id);
    if (!c) return;
    const g = c.closest("details.group");
    if (g && !g.open) g.open = true;
    c.scrollIntoView({ block: "center" });
  }
  window.addEventListener("hashchange", reveal);
  // the Strategy and Players and posts links open their folds
  $("jump-strategy").addEventListener("click", () => { const s = $("strategy"); if (s) s.open = true; });
  $("jump-history").addEventListener("click", () => { const s = $("history"); if (s) s.open = true; });
  Stats.start("roadmap", (b) => { const first = !body; body = b; drawAll(); if (first) reveal(); });
</script>
</body>
</html>
